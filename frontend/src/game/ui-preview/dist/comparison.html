&lt;script&gt;// Original SVG pixel portraits. All lobby data stays in this browser tab.

];
function portrait(id){const a=avatarList.find(a=&gt;a.id===id)||avatarList[0];let top='';if(a.ears==='cat')top=`&lt;path d=&quot;M10 22V4h12l10 14h8L50 4h12v26&quot; fill=&quot;${a.color}&quot;/&gt;&lt;path d=&quot;M14 18V9h6l7 10zm32 0 8-9h4v10&quot; fill=&quot;#ec86a6&quot;/&gt;`;if(a.ears==='rabbit')top='&lt;path d=&quot;M14 28V4h12v24h20V4h12v28&quot; fill=&quot;#f9e9f6&quot;/&gt;&lt;path d=&quot;M18 8h4v16h-4zm32 0h4v16h-4z&quot; fill=&quot;#ed8bc4&quot;/&gt;';if(a.ears==='bear')top=`&lt;path d=&quot;M7 25V12h16v13zm42 0V12h16v13z&quot; fill=&quot;${a.patches?'#252135':a.color}&quot;/&gt;`;if(a.ears==='robot')top='&lt;path d=&quot;M34 4h4v14h-4z&quot; fill=&quot;#73d9e9&quot;/&gt;&lt;path d=&quot;M30 2h12v8H30z&quot; fill=&quot;#ff2ea6&quot;/&gt;';if(a.ears==='frog')top='&lt;path d=&quot;M10 28V12h20v16zm32 0V12h20v16z&quot; fill=&quot;#81ce45&quot;/&gt;&lt;path d=&quot;M14 14h12v14H14zm32 0h12v14H46z&quot; fill=&quot;#fff8d7&quot;/&gt;&lt;path d=&quot;M18 16h6v8h-6zm30 0h6v8h-6z&quot; fill=&quot;#181225&quot;/&gt;';let face=`&lt;path d=&quot;M14 22h44v6h6v28h-6v8H14v-8H8V28h6z&quot; fill=&quot;${a.color}&quot;/&gt;`;if(a.ears==='frog')face='&lt;path d=&quot;M10 26h52v6h6v22h-6v8H10v-8H4V32h6z&quot; fill=&quot;#81ce45&quot;/&gt;';let details=a.ears==='frog'?'&lt;path d=&quot;M15 42h42v5H15zm6 5h30v5H21z&quot; fill=&quot;#304c27&quot;/&gt;&lt;path d=&quot;M21 47h30v5H21z&quot; fill=&quot;#ff9c91&quot;/&gt;':a.ears==='robot'?'&lt;path d=&quot;M16 29h40v17H16z&quot; fill=&quot;#201831&quot;/&gt;&lt;path d=&quot;M22 33h8v8h-8zm20 0h8v8h-8z&quot; fill=&quot;#b6ff00&quot;/&gt;&lt;path d=&quot;M26 52h20v5H26z&quot; fill=&quot;#201831&quot;/&gt;':'&lt;path d=&quot;M21 33h6v8h-6zm24 0h6v8h-6z&quot; fill=&quot;#251b31&quot;/&gt;&lt;path d=&quot;M33 44h6v5h-6zm-6 9h18v4H27z&quot; fill=&quot;#593950&quot;/&gt;';if(a.ears==='cat')details='&lt;path d=&quot;M18 43h36v13h-6v6H24v-6h-6z&quot; fill=&quot;#fff4dc&quot;/&gt;'+details;if(a.patches)details='&lt;path d=&quot;M15 29h16v17H15zm26 0h16v17H41z&quot; fill=&quot;#252135&quot;/&gt;&lt;path d=&quot;M22 33h5v7h-5zm23 0h5v7h-5z&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M32 49h8v5h-8zm-5 8h18v4H27z&quot; fill=&quot;#252135&quot;/&gt;';if(a.glasses)details+='&lt;path d=&quot;M12 30h48v5h-4v12H40V35h-8v12H16V35h-4z&quot; fill=&quot;#1b1727&quot;/&gt;&lt;path d=&quot;M20 34h8v3h-8zm24 0h8v3h-8z&quot; fill=&quot;#ffffffb0&quot;/&gt;';if(a.spectacles)details+='&lt;path d=&quot;M15 29h17v18H15zm25 0h17v18H40z&quot; fill=&quot;none&quot; stroke=&quot;#251b31&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M32 35h8&quot; stroke=&quot;#251b31&quot; stroke-width=&quot;3&quot;/&gt;';if(a.ears==='duck')details+='&lt;path d=&quot;M28 43h26v12H28z&quot; fill=&quot;#f89832&quot;/&gt;';return `&lt;svg viewBox=&quot;0 0 72 72&quot; aria-hidden=&quot;true&quot; shape-rendering=&quot;crispEdges&quot;&gt;${top}${face}${details}&lt;/svg&gt;`}
const crewColors=['#b6ff00','#ff2ea6','#00f0ff','#bd79ff'];
let nextPlayerId=3;
const players=[{id:1,name:'',avatar:'cat'},{id:2,name:'',avatar:'rabbit'}];
const lobby=document.querySelector('.lobby-screen'),homeScreen=document.querySelector('.title-screen'),playerGrid=document.querySelector('#player-grid'),avatarDialog=document.querySelector('#avatar-dialog');
let editingPlayer=null;
function openLobby(){homeScreen.hidden=true;lobby.hidden=false;document.querySelector('.arcade').classList.add('in-lobby');renderPlayers();document.querySelector('#lobby-title').focus();window.scrollTo(0,0)}
function goHome(){lobby.hidden=true;homeScreen.hidden=false;document.querySelector('.arcade').classList.remove('in-lobby');document.querySelector('[data-mode=&quot;Team&quot;]').focus()}
function nameError(){if(players.length&lt;2)return 'Add at least 2 players.';const names=players.map(p=&gt;p.name.trim().toLocaleLowerCase());if(names.some(n=&gt;!n))return 'Enter a name for each player.';if(new Set(names).size!==names.length)return 'Use a different name for each player.';return ''}
function updateLobby(){const error=nameError();document.querySelector('#player-count').textContent=`PLAYERS (${players.length} / 4)`;document.querySelector('#start-team').disabled=!!error;document.querySelector('#lobby-status').textContent=error||'';}
function renderPlayers(){playerGrid.replaceChildren();for(let i=0;i&lt;4;i++){const p=players[i];const card=document.createElement(p?'article':'button');card.className=p?'player-card':'empty-player';card.style.setProperty('--player-color',crewColors[i]);if(!p){card.type='button';card.setAttribute('aria-label',`Add player ${players.length+1}`);card.innerHTML='&lt;span class=&quot;add-symbol&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;span&gt;ADD PLAYER&lt;/span&gt;';card.addEventListener('click',()=&gt;{if(players.length&gt;=4)return;const added={id:nextPlayerId++,name:'',avatar:avatarList[players.length].id};players.push(added);renderPlayers();playerGrid.querySelector(`[data-player-id=&quot;${added.id}&quot;] input`).focus();blip(440)});playerGrid.appendChild(card);continue}card.dataset.playerId=p.id;card.setAttribute('aria-label',`Player ${i+1}`);card.innerHTML=`&lt;div class=&quot;card-top&quot;&gt;&lt;span&gt;${'PLAYER '+(i+1)}&lt;/span&gt;&lt;button class=&quot;remove-player&quot; aria-label=&quot;Remove player ${i+1}&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;avatar-button&quot; aria-label=&quot;Choose avatar for player ${i+1}&quot;&gt;${portrait(p.avatar)}&lt;span&gt;CHANGE AVATAR&lt;/span&gt;&lt;/button&gt;&lt;label class=&quot;sr-only&quot; for=&quot;player-${p.id}&quot;&gt;P${i+1}&lt;/label&gt;&lt;input id=&quot;player-${p.id}&quot; class=&quot;player-name&quot; maxlength=&quot;16&quot; placeholder=&quot;YOUR NAME&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; aria-label=&quot;Player ${i+1} name&quot;&gt;`;const input=card.querySelector('input');input.value=p.name;input.addEventListener('input',()=&gt;{p.name=input.value;updateLobby()});card.querySelector('.remove-player').addEventListener('click',()=&gt;{players.splice(players.findIndex(x=&gt;x.id===p.id),1);renderPlayers();(playerGrid.querySelector('.empty-player')||document.querySelector('#home')).focus()});card.querySelector('.avatar-button').addEventListener('click',()=&gt;openAvatarPicker(p.id));playerGrid.appendChild(card)}updateLobby()}
function openAvatarPicker(id){editingPlayer=id;const p=players.find(p=&gt;p.id===id);if(!p)return;document.querySelector('#avatar-title').textContent=`Player ${players.indexOf(p)+1} avatar`;const grid=document.querySelector('#avatar-options');grid.replaceChildren();for(const avatar of avatarList){const b=document.createElement('button');b.className='avatar-option';b.setAttribute('aria-label',avatar.name);b.setAttribute('aria-pressed',String(avatar.id===p.avatar));b.innerHTML=portrait(avatar.id)+`&lt;span&gt;${avatar.name}&lt;/span&gt;`;b.addEventListener('click',()=&gt;{p.avatar=avatar.id;avatarDialog.close();renderPlayers();playerGrid.querySelector(`[data-player-id=&quot;${p.id}&quot;] .avatar-button`).focus();blip(440)});grid.appendChild(b)}avatarDialog.showModal()}
document.querySelector('.close-picker').addEventListener('click',()=&gt;avatarDialog.close());avatarDialog.addEventListener('click',e=&gt;{if(e.target===avatarDialog)avatarDialog.close()});document.querySelector('#home').addEventListener('click',goHome);

document.querySelector('#start-team').addEventListener('click',()=&gt;{if(players.length&lt;2||nameError())return;blip(660);document.querySelector('#dialog-title').textContent='PLAYERS SELECTED';document.querySelector('#dialog-copy').textContent=players.map(p=&gt;p.name.trim()).join(' · ');document.querySelector('.preview-note').textContent='Gameplay is not connected yet.';document.querySelector('#back').textContent='BACK TO LOBBY';dialog.showModal()});
