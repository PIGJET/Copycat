<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" role="img" aria-labelledby="title desc"><title id="title">From webcam movement to a dance score</title><desc id="desc">Capture 33 landmarks, normalize 11 segment directions, align with dynamic time warping, then calculate motion-weighted scores.</desc><rect width="1280" height="290" fill="#100b1d"/><text x="40" y="47" fill="#f4e9ff" font-family="sans-serif" font-size="24" font-weight="bold">FROM MOVEMENT TO A MEANINGFUL SCORE</text><rect x="40" y="80" width="280" height="170" fill="#1c1328" stroke="#4c365e"/><text x="60" y="116" fill="#b4df77" font-family="monospace" font-size="14">01 / CAPTURE</text><text x="60" y="163" fill="#f4e9ff" font-family="sans-serif" font-size="20" font-weight="bold">33 body landmarks</text><text x="60" y="198" fill="#b9a5c9" font-family="sans-serif" font-size="17">MediaPipe in the browser</text><path d="M327 165h16m-6-6 6 6-6 6" fill="none" stroke="#b4df77" stroke-width="2"/><rect x="350" y="80" width="280" height="170" fill="#1c1328" stroke="#4c365e"/><text x="370" y="116" fill="#b4df77" font-family="monospace" font-size="14">02 / NORMALIZE</text><text x="370" y="163" fill="#f4e9ff" font-family="sans-serif" font-size="20" font-weight="bold">11 segment directions</text><text x="370" y="198" fill="#b9a5c9" font-family="sans-serif" font-size="17">Resample to 15 FPS</text><path d="M637 165h16m-6-6 6 6-6 6" fill="none" stroke="#b4df77" stroke-width="2"/><rect x="660" y="80" width="280" height="170" fill="#1c1328" stroke="#4c365e"/><text x="680" y="116" fill="#b4df77" font-family="monospace" font-size="14">03 / ALIGN</text><text x="680" y="163" fill="#f4e9ff" font-family="sans-serif" font-size="20" font-weight="bold">Dynamic time warping</text><text x="680" y="198" fill="#b9a5c9" font-family="sans-serif" font-size="17">Bounded timing drift</text><path d="M947 165h16m-6-6 6 6-6 6" fill="none" stroke="#b4df77" stroke-width="2"/><rect x="970" y="80" width="280" height="170" fill="#1c1328" stroke="#4c365e"/><text x="990" y="116" fill="#b4df77" font-family="monospace" font-size="14">04 / SCORE</text><text x="990" y="163" fill="#f4e9ff" font-family="sans-serif" font-size="20" font-weight="bold">Arms, legs, torso, timing</text><text x="990" y="198" fill="#b9a5c9" font-family="sans-serif" font-size="17">Motion-weighted results</text></svg>